<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="#" method="get">

        <!-- Agrupamento 1 -->
        <fieldset>
            <label>
                <input type="radio" name="sexo" id="isxmas" value="masculino"> Masculino
            </label>
            <br>
            <label>
                <input type="radio" name="sexo" id="isxfem" value="feminino" checked> Feminino
            </label>
        </fieldset>

        <!-- Agrupamento 2 -->
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <label>
                <input type="checkbox" name="esbas" id="iesbas"> Basquete<br>
            </label>

            <label>
                <input type="checkbox" name="esfut" id="iesfut" checked> Futebol <br>
            </label>

            <label>
                <input type="checkbox" name="esnat" id="iesnat"> Natação <br>
            </label>

            <label>
                <input type="checkbox" name="esten" id="iesten"> Tênis
            </label>
        </fieldset>
        
        <!-- Botões -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>


    </form>
    
</body>
</html>
