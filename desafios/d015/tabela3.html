<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das Tabelas</title>
    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }
        thead > tr > th {
            background-color: grey;
            color: white;
        }
        th, td {
            border: 1px black solid;
            padding: 1.5px;
        }
        .notas-td {
            text-align: center;
        }
        .media-exatas, .media-humanas {
            text-align: left;
            background-color: grey;
            color: white;
        }

        .total-media {
            background-color: grey;
            color: white;
            text-align: center;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td >Matemática</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="media-exatas">Média de exatas</th>
                <td class="total-media">0.0</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                </tr>
            <tr>
                <td>Geografia</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
                <td class="notas-td">0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="media-humanas">Média de Humanas</th>
                <td class="total-media">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
